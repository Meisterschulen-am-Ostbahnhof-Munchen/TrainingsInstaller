name: release

# Installer-Release (KONZEPT.md 3.3): Tag v<version.txt> pushen, z. B.
#   git tag v0.1.0 && git push origin v0.1.0
# Ein Release entsteht NUR, wenn die Freigabe-Prüfung mit --full (alle Tags, .lib-Inhalt,
# Firmware, SHA256 aller Werkzeuge) und alle Tests grün sind.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    uses: ./.github/workflows/manifest-check.yml
    with:
      full: true

  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: [manifest, tests]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: ZIP bauen (Tag muss zu version.txt passen)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}   # nie direkt in den Befehl einsetzen (Code im Tag-Namen)
        run: python tools/build_release.py --tag "$env:TAG" --out dist

      - name: Probestart aus dem ZIP (Bootstrap lädt Python, startet den Kern)
        shell: pwsh
        env:
          MS_SL_ROOT: ${{ runner.temp }}\ms_sl
        run: |
          $x = Join-Path $env:RUNNER_TEMP 'zip'
          Expand-Archive dist\TrainingsInstaller.zip -DestinationPath $x
          & "$x\TrainingsInstaller\install.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw "install.cmd --help: Exit $LASTEXITCODE" }
          if (-not (Test-Path "$env:MS_SL_ROOT\installer\version.txt")) { throw 'Installer wurde nicht nach installer\ kopiert' }

      - name: GitHub-Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$env:TAG" dist/TrainingsInstaller.zip
          --title "Trainings-Installer $env:TAG"
          --notes-file dist/RELEASE_NOTES.md
          --verify-tag
