name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v
      - name: Kompilieren (Syntax aller Module)
        run: python -m compileall -q trainings_installer
